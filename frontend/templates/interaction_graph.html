<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Reverie - 角色互動關係視覺化</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap-theme.min.css">
  <style>
    .node text {
      pointer-events: none;
      font-family: sans-serif;
    }
    
    .node circle {
      stroke-width: 1.5px;
    }
    
    .link {
      stroke: #999;
      stroke-opacity: 0.6;
    }

    .chart-container {
      border: 1px solid #ddd;
      overflow: hidden;
      cursor: grab;
    }

    .chart-container:active {
      cursor: grabbing;
    }

    .controls {
      margin-top: 10px;
    }

    .btn-group {
      margin-right: 10px;
    }

    .stats-info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      margin: 10px 0;
    }

    .persona-info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin: 10px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .persona-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .persona-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .persona-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .persona-card.active {
      border-color: #667eea;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    }

    .persona-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 10px;
      object-fit: cover;
      border: 3px solid #eee;
    }

    .persona-name {
      font-weight: bold;
      color: #333;
      margin: 0;
    }

    .detail-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 8px;
    }

    .bar-chart {
      margin: 20px 0;
    }

    .bar-item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .bar-item:hover {
      background: #e9ecef;
    }

    .bar-label {
      min-width: 120px;
      font-weight: 500;
      color: #333;
    }

    .bar-visual {
      flex-grow: 1;
      height: 20px;
      background: #e9ecef;
      border-radius: 10px;
      margin: 0 10px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.8s ease;
    }

    .bar-fill.interaction {
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    .bar-fill.location {
      background: linear-gradient(90deg, #f093fb, #f5576c);
    }

    .bar-fill.object {
      background: linear-gradient(90deg, #4ecdc4, #44a08d);
    }

    .bar-value {
      min-width: 40px;
      text-align: right;
      font-weight: bold;
      color: #667eea;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 15px 0;
    }

    .info-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .info-label {
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .info-value {
      color: #333;
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>

<body class="top-navigation" style="background-color: white">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <a href="/" class="btn btn-primary">返回主頁</a>
        <h2 class="text-center">角色互動關係視覺化</h2>
        
        <!-- 統計信息 -->
        <div class="stats-info">
          <div class="row">
            <div class="col-md-3">
              <strong>總角色數：</strong><span id="total-personas">0</span>
            </div>
            <div class="col-md-3">
              <strong>互動對數：</strong><span id="total-interactions">0</span>
            </div>
            <div class="col-md-3">
              <strong>總互動次數：</strong><span id="total-interaction-count">0</span>
            </div>
            <div class="col-md-3">
              <strong>總對話字數：</strong><span id="total-chat-length">0</span>
            </div>
          </div>
        </div>
        
        <!-- 頁籤導航 -->
        <ul class="nav nav-tabs" role="tablist">
          <li role="presentation" class="active">
            <a href="#force-directed" aria-controls="force-directed" role="tab" data-toggle="tab">互動次數力導向圖</a>
          </li>
          <li role="presentation">
            <a href="#chat-matrix" aria-controls="chat-matrix" role="tab" data-toggle="tab">對話長度矩陣圖</a>
          </li>
          <li role="presentation">
            <a href="#persona-details" aria-controls="persona-details" role="tab" data-toggle="tab">角色詳細資料</a>
          </li>
        </ul>
        
        <!-- 頁籤內容 -->
        <div class="tab-content">
          <!-- 互動次數力導向圖 -->
          <div role="tabpanel" class="tab-pane active" id="force-directed">
            <div class="chart-container" style="width: 100%; height: 600px;"></div>
            <div class="controls">
              <div class="btn-group" role="group">
                <button id="zoom-in" class="btn btn-sm btn-default">放大 (+)</button>
                <button id="zoom-out" class="btn btn-sm btn-default">縮小 (-)</button>
                <button id="reset-zoom" class="btn btn-sm btn-default">重置視圖</button>
              </div>
              <div class="btn-group" role="group">
                <button id="center-graph" class="btn btn-sm btn-default">居中顯示</button>
                <button id="fit-to-screen" class="btn btn-sm btn-default">適合畫面</button>
              </div>
              <span style="margin-left: 20px; font-size: 12px; color: #666;">
                提示: 可以拖曳畫布移動視圖，滾輪縮放，拖曳節點調整位置
              </span>
            </div>
          </div>
          
          <!-- 對話長度矩陣圖 -->
          <div role="tabpanel" class="tab-pane" id="chat-matrix">
            <div class="chart-container" style="width: 100%; height: 600px;"></div>
            <div id="debug-info" style="margin-top: 10px; font-family: monospace; font-size: 12px;"></div>
          </div>

          <!-- 角色詳細資料 -->
          <div role="tabpanel" class="tab-pane" id="persona-details">
            <div class="persona-info">
              <h3 style="margin: 0 0 15px 0; text-align: center;">🎭 選擇角色查看詳細資料</h3>
              <p style="text-align: center; margin: 0; opacity: 0.9;">點擊下方角色頭像查看其基本資料、社交關係和活動統計</p>
            </div>

            <!-- 角色選擇網格 -->
            <div class="persona-grid" id="persona-grid">
              <!-- 將由JavaScript動態生成 -->
            </div>

            <!-- 角色詳細信息顯示區域 -->
            <div id="persona-detail-content" style="display: none;">
              <!-- 基本資料 -->
              <div class="detail-section">
                <div class="section-title">👤 基本資料</div>
                <div class="info-grid" id="basic-info">
                  <!-- 將由JavaScript動態生成 -->
                </div>
              </div>

              <!-- 社交關係圖表 -->
              <div class="detail-section">
                <div class="section-title">💬 社交關係統計</div>
                <div class="bar-chart" id="interaction-chart">
                  <!-- 將由JavaScript動態生成 -->
                </div>
              </div>

              <!-- 活動地區統計 -->
              <div class="detail-section">
                <div class="section-title">🏠 活動地區統計</div>
                <div class="bar-chart" id="location-chart">
                  <!-- 將由JavaScript動態生成 -->
                </div>
              </div>

              <!-- 物品互動統計 -->
              <div class="detail-section">
                <div class="section-title">🔧 物品互動統計</div>
                <div class="bar-chart" id="object-chart">
                  <!-- 將由JavaScript動態生成 -->
                </div>
              </div>
            </div>

            <!-- 空狀態 -->
            <div id="empty-state" class="empty-state">
              <h4>請選擇一個角色</h4>
              <p>點擊上方的角色頭像來查看詳細資料</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  
  <script>
    // 從後端獲取數據
    const interactionData = JSON.parse('{{ interaction_data | safe }}');
    const chatLengthData = JSON.parse('{{ chat_length_data | safe }}');
    const allInteractionData = JSON.parse('{{ all_interaction_data | safe }}');
    const personaNames = {{ persona_names | tojson }};
    
    console.log('Interaction Data:', interactionData);
    console.log('Chat Length Data:', chatLengthData);
    console.log('All Interaction Data:', allInteractionData);
    console.log('Persona Names:', personaNames);

    // 全局變數
    let forceDirectedSvg = null;
    let forceDirectedG = null;
    let zoom = null;
    let simulation = null;
    let currentSelectedPersona = null;

    // 角色基本資料
    const personaProfiles = allInteractionData.persona_profiles || {};

    // 當頁面載入完成後初始化圖表
    document.addEventListener('DOMContentLoaded', function() {
      // 更新統計信息
      updateStatistics();
      
      // 初始化角色選擇網格
      initializePersonaGrid();
      
      // 初始化互動次數力導向圖
      createForceDirectedGraph(interactionData, "#force-directed .chart-container");
      
      // 頁籤切換時重新調整圖表大小
      $('a[data-toggle="tab"]').on('shown.bs.tab', function(e) {
        const target = $(e.target).attr("href");
        if (target === '#chat-matrix') {
          createChatLengthMatrix(chatLengthData, "#chat-matrix .chart-container", personaNames);
        }
        window.dispatchEvent(new Event('resize'));
      });
      
      // 綁定控制按鈕事件
      bindControlEvents();
    });

    function updateStatistics() {
      const totalPersonas = personaNames.length;
      const totalInteractions = interactionData.links.length;
      const totalInteractionCount = interactionData.links.reduce((sum, link) => sum + link.value, 0);
      const totalChatLength = chatLengthData.links.reduce((sum, link) => sum + link.length, 0);
      
      document.getElementById('total-personas').textContent = totalPersonas;
      document.getElementById('total-interactions').textContent = totalInteractions;
      document.getElementById('total-interaction-count').textContent = totalInteractionCount;
      document.getElementById('total-chat-length').textContent = totalChatLength;
    }

    // 初始化角色選擇網格
    function initializePersonaGrid() {
      const gridContainer = document.getElementById('persona-grid');
      gridContainer.innerHTML = '';

      personaNames.forEach(personaName => {
        const card = document.createElement('div');
        card.className = 'persona-card';
        card.dataset.persona = personaName;
        
        card.innerHTML = `
          <img src="/static/assets/village/agents/${personaName}/portrait.png" 
               alt="${personaName}" 
               class="persona-avatar"
               onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMzAiIGN5PSIzMCIgcj0iMzAiIGZpbGw9IiM2NjdlZWEiLz4KPGV4dCB4PSIzMCIgeT0iMzUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIiBmb250LXNpemU9IjE0Ij7jgJo8L3RleHQ+Cjwvc3ZnPgo='">
          <p class="persona-name">${personaName}</p>
        `;

        card.addEventListener('click', () => selectPersona(personaName));
        gridContainer.appendChild(card);
      });
    }

    // 選擇角色
    function selectPersona(personaName) {
      // 更新選中狀態
      document.querySelectorAll('.persona-card').forEach(card => {
        card.classList.remove('active');
      });
      document.querySelector(`[data-persona="${personaName}"]`).classList.add('active');

      currentSelectedPersona = personaName;
      
      // 顯示角色詳細信息
      showPersonaDetails(personaName);
      
      // 隱藏空狀態，顯示詳細內容
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('persona-detail-content').style.display = 'block';
    }

    // 顯示角色詳細信息
    function showPersonaDetails(personaName) {
      // 更新基本資料
      updateBasicInfo(personaName);
      
      // 更新社交關係圖表
      updateInteractionChart(personaName);
      
      // 更新活動地區統計
      updateLocationChart(personaName);
      
      // 更新物品互動統計
      updateObjectChart(personaName);
    }

    // 更新基本資料
    function updateBasicInfo(personaName) {
      const profile = personaProfiles[personaName] || {
        age: "未知",
        innate: "待探索",
        learned: "學習中",
        lifestyle: "生活中",
        currently: "活動中"
      };

      const basicInfoContainer = document.getElementById('basic-info');
      basicInfoContainer.innerHTML = `
        <div class="info-item">
          <div class="info-label">姓名</div>
          <div class="info-value">${personaName}</div>
        </div>
        <div class="info-item">
          <div class="info-label">年齡</div>
          <div class="info-value">${profile.age}歲</div>
        </div>
        <div class="info-item">
          <div class="info-label">先天特質</div>
          <div class="info-value">${profile.innate}</div>
        </div>
        <div class="info-item">
          <div class="info-label">後天特質</div>
          <div class="info-value">${profile.learned}</div>
        </div>
        <div class="info-item">
          <div class="info-label">生活習慣</div>
          <div class="info-value">${profile.lifestyle}</div>
        </div>
        <div class="info-item">
          <div class="info-label">當前狀態</div>
          <div class="info-value">${profile.currently}</div>
        </div>
      `;
    }

    // 更新社交關係圖表
    function updateInteractionChart(personaName) {
      const interactions = {};
      
      // 從真實的對話交互數據中統計與其他角色的互動次數
      if (allInteractionData.chat_interactions && allInteractionData.chat_interactions.links) {
        allInteractionData.chat_interactions.links.forEach(link => {
          if (link.source === personaName) {
            interactions[link.target] = (interactions[link.target] || 0) + link.value;
          } else if (link.target === personaName) {
            interactions[link.source] = (interactions[link.source] || 0) + link.value;
          }
        });
      }

      // 如果沒有真實數據，從原始的interactionData中獲取
      if (Object.keys(interactions).length === 0) {
        interactionData.links.forEach(link => {
          if (link.source === personaName) {
            interactions[link.target] = (interactions[link.target] || 0) + link.value;
          } else if (link.target === personaName) {
            interactions[link.source] = (interactions[link.source] || 0) + link.value;
          }
        });
      }

      const chartContainer = document.getElementById('interaction-chart');
      
      if (Object.keys(interactions).length === 0) {
        chartContainer.innerHTML = '<div class="empty-state">暫無社交互動數據</div>';
        return;
      }

      // 獲取最大值用於計算比例
      const maxValue = Math.max(...Object.values(interactions), 1);
      
      // 按互動次數排序，顯示前8個
      const sortedInteractions = Object.entries(interactions)
        .sort(([,a], [,b]) => b - a)
        .slice(0, 8);

      chartContainer.innerHTML = sortedInteractions.map(([partner, count]) => `
        <div class="bar-item">
          <div class="bar-label">${partner}</div>
          <div class="bar-visual">
            <div class="bar-fill interaction" style="width: ${(count / maxValue * 100)}%"></div>
          </div>
          <div class="bar-value">${count}次</div>
        </div>
      `).join('');

      // 添加總互動統計信息
      const totalInteractions = Object.values(interactions).reduce((sum, count) => sum + count, 0);
      const totalPartners = Object.keys(interactions).length;
      
      if (sortedInteractions.length > 0) {
        const summaryHtml = `
          <div style="margin-top: 15px; padding: 10px; background: #f0f8ff; border-radius: 5px; font-size: 12px; color: #666;">
            📊 總計：與 ${totalPartners} 位角色進行了 ${totalInteractions} 次互動
          </div>
        `;
        chartContainer.innerHTML += summaryHtml;
      }
    }

    // 更新活動地區統計
    function updateLocationChart(personaName) {
      const locations = {};
      
      // 從真實數據中獲取該角色的地區交互數據
      if (allInteractionData.location_interactions) {
        allInteractionData.location_interactions.forEach(interaction => {
          if (interaction.agent === personaName) {
            locations[interaction.location] = interaction.count;
          }
        });
      }

      // 如果沒有真實數據，使用模擬數據
      if (Object.keys(locations).length === 0) {
        const sampleLocations = {
          "咖啡廳": Math.floor(Math.random() * 50) + 10,
          "圖書館": Math.floor(Math.random() * 40) + 5,
          "辦公室": Math.floor(Math.random() * 60) + 15,
          "家": Math.floor(Math.random() * 80) + 20,
          "教室": Math.floor(Math.random() * 45) + 8,
          "公園": Math.floor(Math.random() * 25) + 3
        };
        Object.assign(locations, sampleLocations);
      }

      const maxValue = Math.max(...Object.values(locations), 1);
      const chartContainer = document.getElementById('location-chart');

      const sortedLocations = Object.entries(locations)
        .sort(([,a], [,b]) => b - a)
        .slice(0, 8); // 顯示前8個

      if (sortedLocations.length === 0) {
        chartContainer.innerHTML = '<div class="empty-state">暫無活動地區數據</div>';
        return;
      }

      chartContainer.innerHTML = sortedLocations.map(([location, count]) => `
        <div class="bar-item">
          <div class="bar-label">${location}</div>
          <div class="bar-visual">
            <div class="bar-fill location" style="width: ${(count / maxValue * 100)}%"></div>
          </div>
          <div class="bar-value">${count}</div>
        </div>
      `).join('');
    }

    // 更新物品互動統計
    function updateObjectChart(personaName) {
      const objects = {};
      
      // 從真實數據中獲取該角色的物品交互數據
      if (allInteractionData.object_interactions) {
        allInteractionData.object_interactions.forEach(interaction => {
          if (interaction.agent === personaName) {
            objects[interaction.object] = interaction.count;
          }
        });
      }

      // 如果沒有真實數據，使用模擬數據
      if (Object.keys(objects).length === 0) {
        const sampleObjects = {
          "電腦": Math.floor(Math.random() * 100) + 20,
          "書籍": Math.floor(Math.random() * 60) + 10,
          "咖啡機": Math.floor(Math.random() * 40) + 5,
          "手機": Math.floor(Math.random() * 120) + 30,
          "白板": Math.floor(Math.random() * 35) + 8,
          "桌椅": Math.floor(Math.random() * 80) + 15
        };
        Object.assign(objects, sampleObjects);
      }

      const maxValue = Math.max(...Object.values(objects), 1);
      const chartContainer = document.getElementById('object-chart');

      const sortedObjects = Object.entries(objects)
        .sort(([,a], [,b]) => b - a)
        .slice(0, 8); // 顯示前8個

      if (sortedObjects.length === 0) {
        chartContainer.innerHTML = '<div class="empty-state">暫無物品互動數據</div>';
        return;
      }

      chartContainer.innerHTML = sortedObjects.map(([object, count]) => `
        <div class="bar-item">
          <div class="bar-label">${object}</div>
          <div class="bar-visual">
            <div class="bar-fill object" style="width: ${(count / maxValue * 100)}%"></div>
          </div>
          <div class="bar-value">${count}</div>
        </div>
      `).join('');
    }

    // 創建力導向圖
    function createForceDirectedGraph(data, containerSelector) {
      // 清空容器
      d3.select(containerSelector).html("");
      
      // 設置畫布大小
      const container = document.querySelector(containerSelector);
      const width = container.clientWidth;
      const height = 600;

      // 定義顏色比例尺
      const color = d3.scaleOrdinal(d3.schemeCategory10);

      // 創建SVG元素
      const svg = d3.select(containerSelector)
        .append("svg")
        .attr("width", width)
        .attr("height", height);
      
      // 保存全局引用
      forceDirectedSvg = svg;
      
      // 添加縮放和平移功能
      zoom = d3.zoom()
        .scaleExtent([0.1, 10])
        .on("zoom", function(event) {
          g.attr("transform", event.transform);
        });
      
      svg.call(zoom);
      
      // 主圖層
      const g = svg.append("g");
      forceDirectedG = g;

      // 檢查數據
      if (!data.links || data.links.length === 0) {
        g.append("text")
          .attr("x", width / 2)
          .attr("y", height / 2)
          .attr("text-anchor", "middle")
          .attr("font-size", "18px")
          .attr("fill", "#666")
          .text("暫無互動數據");
        return;
      }

      // 創建力導向圖模擬
      simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.links).id(d => d.id).distance(d => Math.max(50, 200 - d.value * 5)))
        .force("charge", d3.forceManyBody().strength(-800))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(50));

      // 連線粗細：根據實際資料範圍動態映射，避免高頻交互全部撞頂
      const linkValues = data.links.map(l => l.value);
      const minVal = d3.min(linkValues) || 1;
      const maxVal = d3.max(linkValues) || 1;
      // 用 scaleSqrt：大數值不會壓縮太多，小數值差異也明顯
      const widthScale = d3.scaleSqrt()
        .domain([minVal, maxVal])
        .range(minVal === maxVal ? [3, 3] : [1.5, 8])
        .clamp(true);

      // 繪製連線
      const link = g.append("g")
        .selectAll("line")
        .data(data.links)
        .enter()
        .append("line")
        .attr("stroke-width", d => widthScale(d.value))
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6);

      // 創建節點組
      const node = g.append("g")
        .selectAll(".node")
        .data(data.nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .style("cursor", "pointer")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      // 添加頭像圖片 (背景圓形)
      node.append("circle")
        .attr("r", 30)
        .attr("fill", "#fff")
        .attr("stroke", d => color(d.group))
        .attr("stroke-width", 3);

      // 添加頭像圖片
      node.append("image")
        .attr("xlink:href", d => "/static/assets/village/agents/" + d.id + "/portrait.png")
        .attr("x", -25)
        .attr("y", -25)
        .attr("width", 50)
        .attr("height", 50)
        .attr("clip-path", "circle(25px at 25px 25px)")
        .style("pointer-events", "none");

      // 添加角色名稱
      node.append("text")
        .attr("dy", 45)
        .attr("text-anchor", "middle")
        .text(d => d.id)
        .attr("font-family", "黑體")
        .attr("font-size", "14px")
        .attr("fill", "#333")
        .attr("font-weight", "bold")
        .attr("pointer-events", "none");

      // 添加互動次數文本到連線上
      const linkText = g.append("g")
        .selectAll(".link-text")
        .data(data.links)
        .enter()
        .append("text")
        .attr("class", "link-text")
        .text(d => d.value)
        .attr("font-family", "黑體")
        .attr("font-size", "12px")
        .attr("fill", "#333")
        .attr("text-anchor", "middle")
        .attr("dy", -5)
        .attr("pointer-events", "none")
        .attr("font-weight", "bold");

      // 添加hover效果和點擊事件
      node.on("mouseover", function(event, d) {
        d3.select(this).select("circle")
          .transition()
          .duration(200)
          .attr("r", 35)
          .attr("stroke-width", 5);
        
        d3.select(this).select("image")
          .transition()
          .duration(200)
          .attr("x", -30)
          .attr("y", -30)
          .attr("width", 60)
          .attr("height", 60);
        
        // 高亮相關連線
        link.style("stroke-opacity", l => 
          l.source.id === d.id || l.target.id === d.id ? 1 : 0.1
        );
        linkText.style("opacity", l => 
          l.source.id === d.id || l.target.id === d.id ? 1 : 0.1
        );

        // 顯示詳細信息
        showNodeInfo(d, data.links);
      })
      .on("mouseout", function(event, d) {
        d3.select(this).select("circle")
          .transition()
          .duration(200)
          .attr("r", 30)
          .attr("stroke-width", 3);
        
        d3.select(this).select("image")
          .transition()
          .duration(200)
          .attr("x", -25)
          .attr("y", -25)
          .attr("height", 50);
        
        // 恢復所有連線
        link.style("stroke-opacity", 0.6);
        linkText.style("opacity", 1);
      })
      .on("click", function(event, d) {
        // 點擊節點時切換到角色詳細資料頁籤並選中該角色
        $('a[href="#persona-details"]').tab('show');
        setTimeout(() => {
          selectPersona(d.id);
        }, 100);
      });

      // 模擬動畫
      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("transform", d => `translate(${d.x}, ${d.y})`);

        linkText
          .attr("x", d => (d.source.x + d.target.x) / 2)
          .attr("y", d => (d.source.y + d.target.y) / 2);
      });

      // 拖曳功能
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        // 保持固定位置，便於觀察
        // d.fx = null;
        // d.fy = null;
      }

      // 初始化視圖
      setTimeout(() => {
        fitToScreen();
      }, 1000);
    }

    function showNodeInfo(node, links) {
      const connections = links.filter(link => 
        link.source.id === node.id || link.target.id === node.id
      );
      
      const totalInteractions = connections.reduce((sum, link) => sum + link.value, 0);
      
      console.log(`${node.id} 的互動詳情:`);
      console.log(`- 總互動次數: ${totalInteractions}`);
      console.log(`- 互動對象: ${connections.length}`);
      connections.forEach(link => {
        const partner = link.source.id === node.id ? link.target.id : link.source.id;
        console.log(`  與 ${partner}: ${link.value} 次`);
      });
    }

    // 創建對話長度矩陣圖
    function createChatLengthMatrix(data, containerSelector, personas) {
      // 清空容器
      d3.select(containerSelector).html("");
      
      if (!personas || personas.length === 0) {
        throw new Error("沒有角色數據");
      }

      // 先計算每個角色的「總對話長度」，再由多到少重新排序行列順序
      const totalByPerson = {};
      personas.forEach(p => { totalByPerson[p] = 0; });
      (data.links || []).forEach(link => {
        const v = link.length || 0;
        if (totalByPerson[link.source] !== undefined) totalByPerson[link.source] += v;
        if (totalByPerson[link.target] !== undefined) totalByPerson[link.target] += v;
      });
      // 重新排序：對話總量多 → 少
      personas = personas.slice().sort((a, b) => totalByPerson[b] - totalByPerson[a]);

      // 創建矩陣
      let matrix = [];
      for (let i = 0; i < personas.length; i++) {
        let row = [];
        for (let j = 0; j < personas.length; j++) {
          row.push(0);
        }
        matrix.push(row);
      }
      
      // 填充矩陣數據
      const linksData = data.links || [];
      
      for (let link of linksData) {
        const source = link.source;
        const target = link.target;
        const value = link.length || 0;
        
        const sourceIdx = personas.indexOf(source);
        const targetIdx = personas.indexOf(target);
        
        if (sourceIdx >= 0 && targetIdx >= 0) {
          matrix[sourceIdx][targetIdx] = value;
          matrix[targetIdx][sourceIdx] = value; // 對稱矩陣
        }
      }
      
      // 設置畫布尺寸
      const margin = { top: 100, right: 100, bottom: 20, left: 100 };
      const width = document.querySelector(containerSelector).clientWidth - margin.left - margin.right;
      const height = 600 - margin.top - margin.bottom;
      
      const cellSize = Math.min(width / personas.length, height / personas.length);
      
      // 創建SVG
      const svg = d3.select(containerSelector)
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);
      
      // 定義顏色比例尺
      const maxVal = d3.max(matrix, row => d3.max(row)) || 1;
      const color = d3.scaleSequential()
        .domain([0, maxVal])
        .interpolator(d3.interpolateYlOrRd);
      
      // 添加行標籤
      svg.selectAll(".row-text")
        .data(personas)
        .enter()
        .append("text")
        .attr("class", "row-text")
        .attr("x", -10)
        .attr("y", (d, i) => i * cellSize + cellSize / 2)
        .attr("text-anchor", "end")
        .attr("alignment-baseline", "middle")
        .attr("font-family", "黑體")
        .attr("font-size", "12px")
        .text(d => d);
      
      // 添加列標籤
      svg.selectAll(".col-text")
        .data(personas)
        .enter()
        .append("text")
        .attr("class", "col-text")
        .attr("x", (d, i) => i * cellSize + cellSize / 2)
        .attr("y", -10)
        .attr("text-anchor", "middle")
        .attr("font-family", "黑體")
        .attr("font-size", "12px")
        .text(d => d);
      
      // 繪製矩陣單元格
      personas.forEach((source, i) => {
        personas.forEach((target, j) => {
          if (i === j) return; // 跳過對角線
          
          const value = matrix[i][j];
          
          svg.append("rect")
            .attr("x", j * cellSize)
            .attr("y", i * cellSize)
            .attr("width", cellSize - 1)
            .attr("height", cellSize - 1)
            .attr("fill", value > 0 ? color(value) : "#f8f8f8")
            .attr("stroke", "#ccc")
            .attr("stroke-width", 1)
            .style("cursor", "pointer")
            .on("mouseover", function() {
              d3.select(this).attr("stroke", "#333").attr("stroke-width", 2);
            })
            .on("mouseout", function() {
              d3.select(this).attr("stroke", "#ccc").attr("stroke-width", 1);
            })
            .on("click", function() {
              // 點擊矩陣單元格時切換到角色詳細資料頁籤並選中源角色
              $('a[href="#persona-details"]').tab('show');
              setTimeout(() => {
                selectPersona(source);
              }, 100);
            })
            .append("title")
            .text(`${source} ↔ ${target}: ${value} 字符`);
          
          if (value > 0) {
            svg.append("text")
              .attr("x", j * cellSize + cellSize / 2)
              .attr("y", i * cellSize + cellSize / 2)
              .attr("text-anchor", "middle")
              .attr("alignment-baseline", "middle")
              .attr("font-family", "黑體")
              .attr("font-size", "10px")
              .attr("fill", value > maxVal/2 ? "white" : "black")
              .text(value);
          }
        });
      });
      
      // 添加圖表標題
      svg.append("text")
        .attr("x", (personas.length * cellSize) / 2)
        .attr("y", -margin.top / 2)
        .attr("text-anchor", "middle")
        .attr("font-family", "黑體")
        .attr("font-size", "16px")
        .attr("font-weight", "bold")
        .text("角色對話長度矩陣");
    }

    // 綁定控制按鈕事件
    function bindControlEvents() {
      document.getElementById('zoom-in').addEventListener('click', function() {
        zoomIn();
      });

      document.getElementById('zoom-out').addEventListener('click', function() {
        zoomOut();
      });

      document.getElementById('reset-zoom').addEventListener('click', function() {
        resetZoom();
      });

      document.getElementById('center-graph').addEventListener('click', function() {
        centerGraph();
      });

      document.getElementById('fit-to-screen').addEventListener('click', function() {
        fitToScreen();
      });
    }

    // 縮放功能
    function zoomIn() {
      if (forceDirectedSvg && zoom) {
        forceDirectedSvg.transition().duration(300).call(
          zoom.scaleBy, 1.5
        );
      }
    }

    function zoomOut() {
      if (forceDirectedSvg && zoom) {
        forceDirectedSvg.transition().duration(300).call(
          zoom.scaleBy, 0.67
        );
      }
    }

    function resetZoom() {
      if (forceDirectedSvg && zoom) {
        forceDirectedSvg.transition().duration(750).call(
          zoom.transform,
          d3.zoomIdentity
        );
      }
    }

    function centerGraph() {
      if (forceDirectedSvg && zoom) {
        const width = forceDirectedSvg.node().clientWidth || 800;
        const height = forceDirectedSvg.node().clientHeight || 600;
        
        forceDirectedSvg.transition().duration(750).call(
          zoom.transform,
          d3.zoomIdentity.translate(width / 2, height / 2).scale(1)
        );
      }
    }

    function fitToScreen() {
      if (forceDirectedSvg && zoom && simulation) {
        const width = forceDirectedSvg.node().clientWidth || 800;
        const height = forceDirectedSvg.node().clientHeight || 600;
        
        // 計算所有節點的邊界
        const nodes = simulation.nodes();
        if (nodes.length === 0) return;
        
        const xExtent = d3.extent(nodes, d => d.x);
        const yExtent = d3.extent(nodes, d => d.y);
        
        const dx = xExtent[1] - xExtent[0];
        const dy = yExtent[1] - yExtent[0];
        const x = (xExtent[0] + xExtent[1]) / 2;
        const y = (yExtent[0] + yExtent[1]) / 2;
        
        const scale = Math.min(width / dx, height / dy) * 0.8;
        
        forceDirectedSvg.transition().duration(750).call(
          zoom.transform,
          d3.zoomIdentity
            .translate(width / 2, height / 2)
            .scale(scale)
            .translate(-x, -y)
        );
      }
    }
  </script>
